name: Repair Android messaging contract

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: align Android forms with Supabase backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Android repository and DTOs
        shell: python
        run: |
          from pathlib import Path

          dto = Path('app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/model/SupabaseDtos.kt')
          text = dto.read_text(encoding='utf-8')
          old = '''@Serializable\ndata class FormRequestDto(\n    val id: String,\n    @SerialName("order_id") val orderId: String,\n    @SerialName("message_id") val messageId: String? = null,\n    val type: String, // numeric, vehicle_plate, motorcycle_plate, timed, text, file, delivery_method, invoice, card_to_card_payment, end_service_summary, survey\n    val prompt: String,\n    val schema: JsonObject? = null,\n    val status: String, // pending, submitted, expired\n    @SerialName("expires_at") val expiresAt: String? = null,\n    @SerialName("created_at") val createdAt: String\n)\n\n@Serializable\ndata class FormResponseDto(\n    val id: String? = null,\n    @SerialName("request_id") val requestId: String,\n    @SerialName("order_id") val orderId: String,\n    val data: JsonObject,\n    @SerialName("created_at") val createdAt: String? = null\n)'''
          new = '''@Serializable\ndata class FormRequestDto(\n    val id: String,\n    @SerialName("conversation_id") val conversationId: String,\n    @SerialName("message_id") val messageId: String? = null,\n    @SerialName("component_template_id") val componentTemplateId: String? = null,\n    val title: String,\n    val schema: JsonObject? = null,\n    val response: JsonObject? = null,\n    val status: String,\n    @SerialName("requested_by") val requestedBy: String,\n    @SerialName("responded_by") val respondedBy: String? = null,\n    @SerialName("expires_at") val expiresAt: String? = null,\n    @SerialName("created_at") val createdAt: String,\n    @SerialName("submitted_at") val submittedAt: String? = null,\n    @SerialName("reviewed_at") val reviewedAt: String? = null,\n    // Compatibility fields populated by the repository from the real backend schema.\n    @kotlinx.serialization.Transient val orderId: String? = null,\n    @kotlinx.serialization.Transient val type: String? = null,\n    @kotlinx.serialization.Transient val prompt: String? = null\n)\n\n@Serializable\ndata class FormResponseDto(\n    val id: String? = null,\n    @SerialName("request_id") val requestId: String,\n    @SerialName("order_id") val orderId: String,\n    val data: JsonObject,\n    @SerialName("created_at") val createdAt: String? = null\n)'''
          if old not in text:
              raise SystemExit('Expected form DTO block was not found')
          dto.write_text(text.replace(old, new), encoding='utf-8')

          repo = Path('app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/repository/OnlineServiceRepositoryImpl.kt')
          text = repo.read_text(encoding='utf-8')

          old_forms = '''    override fun observeFormRequests(orderId: String): Flow<List<FormRequestDto>> = callbackFlow {\n        ensureAuthSession()\n        val channel = client.realtime.channel("forms_$orderId")\n        val formsFlow = channel.postgresChangeFlow<PostgresAction>(schema = "public") {\n            table = "form_requests"\n        }\n\n        val fetchForms = suspend {\n            try {\n                val forms = client.from("form_requests").select {\n                    filter { eq("order_id", orderId) }\n                    order("created_at", Order.ASCENDING)\n                }.decodeAs<List<FormRequestDto>>()\n                trySend(forms)\n            } catch (e: Exception) {\n                Log.e(TAG, "Error fetching forms: ${e.message}")\n            }\n        }\n\n        val job = launch {\n            formsFlow.collect { action ->\n                val record = when (action) {\n                    is PostgresAction.Insert -> action.record\n                    is PostgresAction.Update -> action.record\n                    else -> null\n                }\n                if (record != null) {\n                    val fOrderId = record["order_id"]?.jsonPrimitive?.content\n                    if (fOrderId == orderId) fetchForms()\n                } else if (action is PostgresAction.Delete) {\n                    fetchForms()\n                }\n            }\n        }\n\n        channel.subscribe()\n        fetchForms()\n\n        awaitClose {\n            job.cancel()\n            runBlocking { channel.unsubscribe() }\n        }\n    }\n\n    override fun observeFormResponses(orderId: String): Flow<List<FormResponseDto>> = callbackFlow {\n        ensureAuthSession()\n        val channel = client.realtime.channel("responses_$orderId")\n        val responsesFlow = channel.postgresChangeFlow<PostgresAction>(schema = "public") {\n            table = "form_responses"\n        }\n\n        val fetchResponses = suspend {\n            try {\n                val responses = client.from("form_responses").select {\n                    filter { eq("order_id", orderId) }\n                }.decodeAs<List<FormResponseDto>>()\n                trySend(responses)\n            } catch (e: Exception) { }\n        }\n\n        val job = launch {\n            responsesFlow.collect { action ->\n                val record = when (action) {\n                    is PostgresAction.Insert -> action.record\n                    is PostgresAction.Update -> action.record\n                    else -> null\n                }\n                if (record != null) {\n                    val rOrderId = record["order_id"]?.jsonPrimitive?.content\n                    if (rOrderId == orderId) fetchResponses()\n                } else if (action is PostgresAction.Delete) {\n                    fetchResponses()\n                }\n            }\n        }\n\n        channel.subscribe()\n        fetchResponses()\n\n        awaitClose {\n            job.cancel()\n            runBlocking { channel.unsubscribe() }\n        }\n    }'''
          new_forms = '''    override fun observeFormRequests(orderId: String): Flow<List<FormRequestDto>> = callbackFlow {\n        if (!ensureAuthSession()) {\n            close(IllegalStateException("AUTH_FAILED"))\n            return@callbackFlow\n        }\n\n        val conversationId = getConversationForOrder(orderId).getOrNull()\n        if (conversationId.isNullOrBlank()) {\n            Log.e(TAG, "Cannot observe forms: no conversation for orderId=$orderId")\n            trySend(emptyList())\n            close()\n            return@callbackFlow\n        }\n\n        val channel = client.realtime.channel("forms_$conversationId")\n        val formsFlow = channel.postgresChangeFlow<PostgresAction>(schema = "public") {\n            table = "form_requests"\n        }\n\n        fun mapForm(dto: FormRequestDto): FormRequestDto {\n            val firstField = dto.schema?.get("fields")?.jsonArray?.firstOrNull()?.jsonObject\n            val type = firstField?.get("type")?.jsonPrimitive?.contentOrNull\n            return dto.copy(orderId = orderId, type = type, prompt = dto.title)\n        }\n\n        val fetchForms = suspend {\n            try {\n                val forms = client.from("form_requests").select {\n                    filter { eq("conversation_id", conversationId) }\n                    order("created_at", Order.ASCENDING)\n                }.decodeAs<List<FormRequestDto>>()\n                trySend(forms.map(::mapForm))\n            } catch (e: Exception) {\n                Log.e(TAG, "Error fetching forms for conversation=$conversationId: ${e.message}", e)\n            }\n        }\n\n        val job = launch {\n            formsFlow.collect { action ->\n                val record = when (action) {\n                    is PostgresAction.Insert -> action.record\n                    is PostgresAction.Update -> action.record\n                    else -> null\n                }\n                val eventConversationId = record?.get("conversation_id")?.jsonPrimitive?.contentOrNull\n                if (eventConversationId == conversationId || action is PostgresAction.Delete) {\n                    fetchForms()\n                }\n            }\n        }\n\n        channel.subscribe()\n        fetchForms()\n\n        awaitClose {\n            job.cancel()\n            runBlocking { channel.unsubscribe() }\n        }\n    }\n\n    override fun observeFormResponses(orderId: String): Flow<List<FormResponseDto>> =\n        observeFormRequests(orderId).map { forms ->\n            forms.mapNotNull { form ->\n                form.response?.let { data ->\n                    FormResponseDto(\n                        id = form.id,\n                        requestId = form.id,\n                        orderId = orderId,\n                        data = data,\n                        createdAt = form.submittedAt ?: form.createdAt\n                    )\n                }\n            }\n        }'''
          if old_forms not in text:
              raise SystemExit('Expected form observer block was not found')
          text = text.replace(old_forms, new_forms)

          old_messages = '''            try {\n                val messages = client.from("messages").select {\n                    filter { eq("conversation_id", conversationId) }\n                    order("created_at", Order.ASCENDING)\n                }.decodeAs<List<MessageDto>>()\n                currentList = messages.map { it.toDomain(profileId) }\n                trySend(currentList)\n            } catch (e: Exception) { }'''
          new_messages = '''            try {\n                val messages = client.from("messages").select {\n                    filter { eq("conversation_id", conversationId) }\n                    order("created_at", Order.ASCENDING)\n                }.decodeAs<List<MessageDto>>()\n                currentList = messages.map { it.toDomain(profileId) }\n                trySend(currentList)\n                Log.d(TAG, "Loaded ${currentList.size} messages for conversation=$conversationId")\n            } catch (e: Exception) {\n                Log.e(TAG, "Error fetching messages for conversation=$conversationId: ${e.message}", e)\n            }'''
          if old_messages not in text:
              raise SystemExit('Expected message fetch block was not found')
          text = text.replace(old_messages, new_messages)

          old_action = '''                } catch (e: Exception) { }\n            }\n        }'''
          new_action = '''                } catch (e: Exception) {\n                    Log.e(TAG, "Error processing realtime message for conversation=$conversationId: ${e.message}", e)\n                }\n            }\n        }'''
          # Only replace the first matching block after the getMessages section.
          marker = '    override fun getMessages(conversationId: String, profileId: String): Flow<List<ChatMessage>> = callbackFlow {'
          idx = text.find(marker)
          if idx == -1:
              raise SystemExit('getMessages marker not found')
          tail = text[idx:]
          if old_action not in tail:
              raise SystemExit('Expected realtime message catch block was not found')
          tail = tail.replace(old_action, new_action, 1)
          text = text[:idx] + tail

          repo.write_text(text, encoding='utf-8')
      
      - name: Verify contract strings
        shell: bash
        run: |
          grep -R 'eq("order_id", orderId)' app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/repository/OnlineServiceRepositoryImpl.kt && exit 1 || true
          ! grep -R 'table = "form_responses"' app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/repository/OnlineServiceRepositoryImpl.kt
          grep -R 'eq("conversation_id", conversationId)' app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/repository/OnlineServiceRepositoryImpl.kt

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/model/SupabaseDtos.kt app/src/main/java/com/lucifer/hamrahyar/ui/theme/data/repository/OnlineServiceRepositoryImpl.kt
          git diff --cached --quiet && exit 0
          git commit -m "fix: align Android forms with Supabase backend"
          git push
